<section id="contact" class="sections contact-section">
  <h2 class="section-title">Me contacter</h2>

  <div class="contact-container">
    <p class="contact-intro">
      Un projet, une opportunité ou une question ? N'hésitez pas à m'envoyer un message.
    </p>

    <form (submit)="sendEmail($event)" class="contact-form">
      <div class="form-group">
        <label for="user_name">Nom & Prénom</label>
        <input type="text" id="user_name" name="user_name" placeholder="Ex: Jean Dupont" required />
      </div>

      <div class="form-group">
        <label for="user_email">Adresse email</label>
        <input type="email" id="user_email" name="user_email" placeholder="Ex: jean.dupont@exemple.com" required />
      </div>

      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" placeholder="Votre message..." required></textarea>
      </div>

      <button
        type="submit"
        [disabled]="isSubmitting"
        class="btn btn-primary btn-submit">
        {{ isSubmitting ? 'Envoi en cours...' : 'Envoyer le message' }}
      </button>

      @if (statusMessage) {
        <div class="form-status" [class.success]="isSuccess" [class.error]="!isSuccess">
          {{ statusMessage }}
        </div>
      }
    </form>
  </div>
</section>
